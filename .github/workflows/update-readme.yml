name: Update README with Release Tags

on:
  workflow_dispatch:
  release:
    types: [created, published, edited, released, prereleased, unpublished]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Update README with tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PYTHON_SCRIPT'
          import subprocess
          import json
          import re
          
          result = subprocess.run(['gh', 'release', 'list', '--json', 'tagName'], 
                                capture_output=True, text=True)
          releases = json.loads(result.stdout)
          tags = [r['tagName'] for r in releases]
          
          with open('README.md', 'r') as f:
            content = f.read()
          
          content = re.sub(r'\nPublished Versions:.*', '', content, flags=re.DOTALL)
          
          # Build new section with better formatting
          new_section = '\n\n## Published Versions\n'
          for tag in tags:
            new_section += f'- {tag}\n'
          
          with open('README.md', 'w') as f:
            f.write(content + new_section)
          PYTHON_SCRIPT

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git config --local push.default simple
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update README with release tags" && git push origin main)
