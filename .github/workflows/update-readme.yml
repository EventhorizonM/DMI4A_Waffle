name: Update README with Release Tags

on:
  workflow_dispatch:
  release:
    types: [created, published, edited, released, prereleased, unpublished]

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Update README with tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create a Python script to handle this properly
          python3 << 'PYTHON_SCRIPT'
          import subprocess
          import re
          
          # Get all releases
          result = subprocess.run(['gh', 'release', 'list', '--json', 'tagName', '-q', '.[].tagName'], 
                                capture_output=True, text=True)
          tags = result.stdout.strip().split('\n')
          
          # Read README
          with open('README.md', 'r') as f:
            content = f.read()
          
          # Remove old "Published Versions" section
          content = re.sub(r'\nPublished Versions:.*', '', content, flags=re.DOTALL)
          
          # Build new section
          new_section = '\n\nPublished Versions:'
          for tag in tags:
            if tag.strip():  # Only add non-empty tags
              new_section += f'\n({tag.strip()})'
          
          # Write back
          with open('README.md', 'w') as f:
            f.write(content + new_section + '\n')
          
          print("README updated successfully")
          PYTHON_SCRIPT

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update README with release tags" && git push)
