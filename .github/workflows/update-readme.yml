name: Update README with Release Tags

on:
  workflow_dispatch:
  release:
    types: [created, published, edited, released, prereleased, unpublished]
  
jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Get all release tags
        id: tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAGS=$(gh release list --json tagName -q '.[].tagName')
          TAGS_LIST="Published Versions:"
          while IFS= read -r tag; do
            TAGS_LIST="$TAGS_LIST"$'\n'"($tag)"
          done <<< "$TAGS"
          echo "tags_list<<EOF" >> $GITHUB_OUTPUT
          echo "$TAGS_LIST" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Update README
        env:
          TAGS_LIST: ${{ steps.tags.outputs.tags_list }}
        run: |
          README_CONTENT=$(cat README.md)
          README_CONTENT=$(echo "$README_CONTENT" | sed '/^Published Versions:/,$d')
          echo "$README_CONTENT" > README.md
          echo "" >> README.md
          echo "$TAGS_LIST" >> README.md

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update README with release tags" && git push)
