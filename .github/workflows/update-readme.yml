name: Update README with Release Tags

on:
  workflow_dispatch:
  release:
    types: [created, published, edited, released, prereleased, unpublished]

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Update README with tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Read current README (remove old "Published Versions" section if it exists)
          sed -i '/^Published Versions:/,$d' README.md
          
          # Add new Published Versions section
          echo "" >> README.md
          echo "Published Versions:" >> README.md
          
          # Get all releases and append each tag on a new line
          gh release list --json tagName -q '.[].tagName' | while read tag; do
            echo "($tag)" >> README.md
          done

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update README with release tags" && git push)
