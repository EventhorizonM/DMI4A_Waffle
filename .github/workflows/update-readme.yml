name: Update README with Release Tags

on:
  workflow_dispatch:
  release:
    types: [created, published, edited, released, prereleased, unpublished]

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Update README with tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create a Python script to handle this properly
          python3 << 'PYTHON_SCRIPT'
          import subprocess
          import json
          import re
          
          # Get all releases as JSON
          result = subprocess.run(['gh', 'release', 'list', '--json', 'tagName'], 
                                capture_output=True, text=True)
          releases = json.loads(result.stdout)
          tags = [r['tagName'] for r in releases]
          
          # Read README
          with open('README.md', 'r') as f:
            content = f.read()
          
          # Remove old "Published Versions" section
          content = re.sub(r'\nPublished Versions:.*', '', content, flags=re.DOTALL)
          
          # Build new section with proper newlines
          new_section = '\nPublished Versions:'
          for tag in tags:
            new_section += f'\n({tag})'
          
          # Write back
          with open('README.md', 'w') as f:
            f.write(content + new_section + '\n')
          
          print(f"README updated with {len(tags)} releases")
          for tag in tags:
            print(f"  ({tag})")
          PYTHON_SCRIPT

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update README with release tags" && git push)
