name: Update README with Release Tags

on:
  workflow_dispatch:
  release:
    types: [created, published, edited, released, prereleased, unpublished]

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Get all release tags
        id: tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get all releases and extract tags
          TAGS=$(gh release list --json tagName -q '.[].tagName')
          
          # Create temporary file with tags list
          cat > /tmp/tags_list.txt << 'EOF'
          Published Versions:
          EOF
          
          while IFS= read -r tag; do
            echo "($tag)" >> /tmp/tags_list.txt
          done <<< "$TAGS"
          
          # Save to output
          echo "tags_list<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/tags_list.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Update README
        run: |
          # Read current README
          README_CONTENT=$(cat README.md)
          
          # Remove old "Published Versions" section if it exists
          README_CONTENT=$(echo "$README_CONTENT" | sed '/^Published Versions:/,$d')
          
          # Append new tags section
          echo "$README_CONTENT" > README.md
          echo "" >> README.md
          cat /tmp/tags_list.txt >> README.md

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update README with release tags" && git push)
