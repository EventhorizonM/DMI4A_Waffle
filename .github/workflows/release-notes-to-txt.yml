name: Generate Release Notes TXT

on:
  release:
    types: [published, edited]

jobs:
  generate-txt:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Download current release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          # Fetch release notes using GitHub CLI
          gh release view "$TAG_NAME" --json body --jq '.body' > RN.txt
          
          echo "Release notes saved to RN.txt"
          echo "Content:"
          cat RN.txt
      
      - name: Upload RN.txt to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          # Upload the file to the release
          gh release upload "$TAG_NAME" RN.txt --clobber --repo ${{ github.repository }}
          
          echo "✅ Uploaded RN.txt to release $TAG_NAME"
