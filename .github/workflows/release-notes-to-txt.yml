name: Generate Release Notes TXT

on:
  release:
    types: [published, edited]

jobs:
  generate-txt:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Get release notes using GitHub API
        id: get_release
        uses: actions/github-script@v7
        with:
          script: |
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: context.payload.release.tag_name
            });
            
            const fs = require('fs');
            const releaseNotes = release.body || '';
            fs.writeFileSync('RN.txt', releaseNotes);
            
            console.log('Release notes saved, length:', releaseNotes.length);
            core.setOutput('upload_url', release.upload_url);
            core.setOutput('tag_name', release.tag_name);
      
      - name: Upload RN.txt to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.get_release.outputs.upload_url }}
          asset_path: ./RN.txt
          asset_name: RN.txt
          asset_content_type: text/plain
          overwrite: true  # ← This is key! Overwrites existing file
