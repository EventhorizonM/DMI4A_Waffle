name: Generate Release Notes

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g., V0.1)'
        required: true
        type: string
  release:
    types: [created, published, edited, released, prereleased, unpublished]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  
jobs:
  create-release-notes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Set release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Get release info
        id: release
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            gh release view ${{ steps.tag.outputs.tag }} --json body -q '.body' > release_body.txt
          else
            echo "${{ github.event.release.body }}" > release_body.txt
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create RNotes.txt
        run: cat release_body.txt > RNotes.txt

      - name: Upload to release
        uses: softprops/action-gh-release@v1
        with:
          files: RNotes.txt
          tag_name: ${{ steps.tag.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
