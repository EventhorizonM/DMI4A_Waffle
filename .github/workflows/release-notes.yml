name: Generate Release Notes
on:
  workflow_dispatch:
  release:
    types: [created, published, edited, finalized, released, unpublished]
jobs:
  create-release-notes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create RNotes.txt
        run: echo "${{ github.event.release.body }}" > RNotes.txt

      - name: Upload RNotes.txt to release
        uses: softprops/action-gh-release@v1
        with:
          files: RNotes.txt
          tag_name: ${{ github.event.release.tag_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
