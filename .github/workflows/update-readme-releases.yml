name: Update README with Release Tags

on:
  workflow_dispatch:
  release:
    types: [created, published, edited, released, prereleased, unpublished]

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Update README with tags
        id: update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PYTHON_SCRIPT'
          import subprocess
          import json
          import re
          import os
          
          # Get all release tags
          result = subprocess.run(['gh', 'release', 'list', '--json', 'tagName'], 
                                capture_output=True, text=True)
          releases = json.loads(result.stdout)
          tags = [r['tagName'] for r in releases]
          
          # Read current README
          with open('README.md', 'r') as f:
            content = f.read()
          
          # Remove existing Published Versions section
          if '## Published Versions' in content:
            content = re.sub(r'\n## Published Versions\n(?:- .*?\n)*', '\n', content)
          
          # Build new section
          if tags:
            new_section = '\n## Published Versions\n'
            for tag in tags:
              new_section += f'- {tag}\n'
          else:
            new_section = ''
          
          # Clean up any double newlines
          content = re.sub(r'\n{3,}', '\n\n', content)
          final_content = content + new_section
          
          # Write updated content
          with open('README.md', 'w') as f:
            f.write(final_content)
          
          # Save for later step
          with open('updated_content.txt', 'w') as f:
            f.write(final_content)
          
          print(f"Updated with {len(tags)} tags")
          PYTHON_SCRIPT

      - name: Commit via GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get default branch
          DEFAULT_BRANCH=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}" | \
            python3 -c "import sys, json; print(json.load(sys.stdin)['default_branch'])")
          
          echo "Default branch: $DEFAULT_BRANCH"
          
          # Get current file SHA and content
          FILE_INFO=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/README.md?ref=${DEFAULT_BRANCH}")
          
          CURRENT_SHA=$(echo "$FILE_INFO" | python3 -c "import sys, json; print(json.load(sys.stdin).get('sha', ''))")
          
          # Encode the new content
          ENCODED_CONTENT=$(cat README.md | python3 -c "import sys, base64; print(base64.b64encode(sys.stdin.read().encode()).decode())")
          
          # Update the file via API
          RESPONSE=$(curl -s -X PUT \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/README.md" \
            -d "{
              \"message\": \"Update README with release tags [skip ci]\",
              \"content\": \"${ENCODED_CONTENT}\",
              \"sha\": \"${CURRENT_SHA}\",
              \"branch\": \"${DEFAULT_BRANCH}\"
            }")
          
          echo "$RESPONSE"
          
          if echo "$RESPONSE" | grep -q '"commit"'; then
            echo "✅ Successfully updated README.md"
          else
            echo "❌ Failed to update README.md"
            echo "$RESPONSE"
            exit 1
          fi
