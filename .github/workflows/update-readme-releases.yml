name: Update README with Release Tags

on:
  workflow_dispatch:
  release:
    types: [created, published, edited, released, prereleased, unpublished]

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Update README with tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PYTHON_SCRIPT'
          import subprocess
          import json
          import re
          
          # Get all release tags
          result = subprocess.run(['gh', 'release', 'list', '--json', 'tagName'], 
                                capture_output=True, text=True)
          releases = json.loads(result.stdout)
          tags = [r['tagName'] for r in releases]
          
          # Read current README
          with open('README.md', 'r') as f:
            content = f.read()
          
          # Remove existing Published Versions section
          if '## Published Versions' in content:
            content = re.sub(r'\n## Published Versions\n(?:- .*?\n)*', '\n', content)
          
          # Build new section
          if tags:
            new_section = '\n## Published Versions\n'
            for tag in tags:
              new_section += f'- {tag}\n'
          else:
            new_section = ''
          
          # Clean up any double newlines
          content = re.sub(r'\n{3,}', '\n\n', content)
          
          # Write updated content
          with open('README.md', 'w') as f:
            f.write(content + new_section)
          
          print(f"Updated with {len(tags)} tags")
          PYTHON_SCRIPT

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Get the default branch name
          DEFAULT_BRANCH=$(git remote show origin | grep "HEAD branch" | cut -d ":" -f 2 | xargs)
          echo "Default branch is: $DEFAULT_BRANCH"
          
          # Check if we have changes
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          # Add the changed file
          git add README.md
          
          # Create a temporary branch from the current detached HEAD
          TEMP_BRANCH="temp-update-readme-$(date +%s)"
          git checkout -b $TEMP_BRANCH
          
          # Commit on the temporary branch
          git commit -m "Update README with release tags [skip ci]"
          
          # Push the temporary branch
          git push origin $TEMP_BRANCH
          
          # Use GitHub API to merge the temporary branch into default branch
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/merges" \
            -d "{
              \"base\": \"${DEFAULT_BRANCH}\",
              \"head\": \"${TEMP_BRANCH}\",
              \"commit_message\": \"Merge README update from ${TEMP_BRANCH}\"
            }"
          
          # Delete the temporary branch
          git push origin --delete $TEMP_BRANCH
