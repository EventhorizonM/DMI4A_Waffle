name: Update README with Release Tags

on:
  workflow_dispatch:
  release:
    types: [created, published, edited, released, prereleased, unpublished]

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Update README with tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PYTHON_SCRIPT'
          import subprocess
          import json
          import re
          from datetime import datetime
          
          try:
              # Get all releases with tags and their dates
              # Using only available fields: tagName, createdAt, publishedAt
              result = subprocess.run(['gh', 'release', 'list', '--json', 'tagName,createdAt,publishedAt'], 
                                    capture_output=True, text=True, check=True)
              releases = json.loads(result.stdout)
              
              # Prepare tags with dates
              tags_with_dates = []
              for r in releases:
                  tag = r['tagName']
                  # Use publishedAt if available (non-null), fallback to createdAt
                  date_str = r.get('publishedAt') or r.get('createdAt')
                  
                  if date_str:
                      # Parse ISO format date
                      date_obj = datetime.fromisoformat(date_str.replace('Z', '+00:00'))
                      formatted_date = date_obj.strftime('%d/%m/%Y')
                      tags_with_dates.append(f'{tag} ({formatted_date})')
                  else:
                      tags_with_dates.append(tag)
              
              # Read current README
              with open('README.md', 'r') as f:
                  content = f.read()
              
              # More robust pattern: Remove from "## Published Versions" until next ## or end of file
              pattern = r'\n## Published Versions\n(?:- .*\n)*?(?=\n## |\Z)'
              new_content = re.sub(pattern, '\n', content, flags=re.MULTILINE | re.DOTALL)
              
              # Check if any replacement was made
              if new_content == content and '## Published Versions' in content:
                  # Fallback: simpler pattern
                  new_content = re.sub(r'\n## Published Versions\n(?:- .*?\n)*', '\n', content)
              
              content = new_content
              
              # Build new section
              if tags_with_dates:
                  new_section = '\n## Published Versions\n'
                  for tag_with_date in tags_with_dates:
                      new_section += f'- {tag_with_date}\n'
                  print(f"✅ Updated with {len(tags_with_dates)} tags")
                  # Print first few tags as sample
                  sample = ', '.join(tags_with_dates[:3])
                  if len(tags_with_dates) > 3:
                      sample += '...'
                  print(f"   Tags: {sample}")
              else:
                  new_section = ''
                  print("ℹ️ No tags found, section removed")
              
              # Clean up excessive blank lines
              content = re.sub(r'\n{3,}', '\n\n', content)
              
              # Write updated content
              with open('README.md', 'w') as f:
                  f.write(content + new_section)
              
              print(f"✅ README.md successfully updated")
              
          except subprocess.CalledProcessError as e:
              print(f"❌ Error running gh command: {e}")
              print(f"Error output: {e.stderr}")
              exit(1)
          except json.JSONDecodeError as e:
              print(f"❌ Error parsing JSON: {e}")
              exit(1)
          except FileNotFoundError:
              print(f"❌ README.md not found")
              exit(1)
          except Exception as e:
              print(f"❌ Unexpected error: {e}")
              exit(1)
          PYTHON_SCRIPT

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update README with release tags and dates"
            git push origin HEAD:main --force
            echo "✅ Changes committed and pushed"
          fi
