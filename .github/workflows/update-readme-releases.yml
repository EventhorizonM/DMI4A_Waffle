name: Update README with Release Tags

on:
  workflow_dispatch:
  release:
    types: [created, published, edited, released, prereleased, unpublished]

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Update README with tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PYTHON_SCRIPT'
          import subprocess
          import json
          import re
          
          # Get all release tags
          result = subprocess.run(['gh', 'release', 'list', '--json', 'tagName'], 
                                capture_output=True, text=True)
          releases = json.loads(result.stdout)
          tags = [r['tagName'] for r in releases]
          
          # Read current README
          with open('README.md', 'r') as f:
            content = f.read()
          
          # Remove existing Published Versions section
          if '## Published Versions' in content:
            content = re.sub(r'\n## Published Versions\n(?:- .*?\n)*', '\n', content)
          
          # Build new section
          if tags:
            new_section = '\n## Published Versions\n'
            for tag in tags:
              new_section += f'- {tag}\n'
          else:
            new_section = ''
          
          # Clean up any double newlines
          content = re.sub(r'\n{3,}', '\n\n', content)
          
          # Write updated content
          with open('README.md', 'w') as f:
            f.write(content + new_section)
          
          print(f"Updated with {len(tags)} tags")
          PYTHON_SCRIPT

      - name: Commit and push using gh CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Configure git
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Get default branch
          DEFAULT_BRANCH=$(gh repo view --json defaultBranchRef --jq '.defaultBranchRef.name')
          echo "Default branch: $DEFAULT_BRANCH"
          
          # Check if there are changes
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          # Add the file
          git add README.md
          
          # Create a patch file
          git diff --cached > readme.patch
          
          # Apply the patch to the default branch using gh CLI
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/git/commits" \
            -f message="Update README with release tags [skip ci]" \
            -f content="$(base64 -w 0 README.md)" \
            -f branch="${DEFAULT_BRANCH}" \
            --field path="README.md"
          
          echo "✅ Successfully updated README.md"
