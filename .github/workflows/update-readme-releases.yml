name: Update README with Release Tags

on:
  workflow_dispatch:
  release:
    types: [created, published, edited, released, prereleased, unpublished]

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Update README and commit via API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # This script uses ONLY the GitHub API - NO git commands at all
          python3 << 'PYTHON_SCRIPT'
          import subprocess
          import json
          import re
          import base64
          import requests
          import os
          
          # Get repository info
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          
          headers = {
              'Authorization': f'token {token}',
              'Accept': 'application/vnd.github.v3+json'
          }
          
          # Get default branch
          repo_url = f'https://api.github.com/repos/{repo}'
          response = requests.get(repo_url, headers=headers)
          default_branch = response.json()['default_branch']
          print(f"Default branch: {default_branch}")
          
          # Get all release tags using gh CLI
          result = subprocess.run(['gh', 'release', 'list', '--json', 'tagName'], 
                                capture_output=True, text=True)
          releases = json.loads(result.stdout)
          tags = [r['tagName'] for r in releases]
          
          # Read current README content from the repo (not local file)
          readme_url = f'https://api.github.com/repos/{repo}/contents/README.md?ref={default_branch}'
          response = requests.get(readme_url, headers=headers)
          
          if response.status_code == 200:
              current_data = response.json()
              current_content = base64.b64decode(current_data['content']).decode('utf-8')
              current_sha = current_data['sha']
              print("Successfully fetched current README from repo")
          else:
              print(f"Error fetching README: {response.status_code}")
              exit(1)
          
          # Remove existing Published Versions section
          if '## Published Versions' in current_content:
              current_content = re.sub(r'\n## Published Versions\n(?:- .*?\n)*', '\n', current_content)
              print("Removed existing Published Versions section")
          
          # Build new section
          if tags:
              new_section = '\n## Published Versions\n'
              for tag in tags:
                  new_section += f'- {tag}\n'
              print(f"Added {len(tags)} tags")
          else:
              new_section = ''
              print("No tags found")
          
          # Clean up any double newlines
          current_content = re.sub(r'\n{3,}', '\n\n', current_content)
          new_content = current_content + new_section
          
          # Check if content actually changed
          if new_content == current_content:
              print("No changes needed - README already up to date")
              exit(0)
          
          # Update the file via API
          update_url = f'https://api.github.com/repos/{repo}/contents/README.md'
          encoded_content = base64.b64encode(new_content.encode('utf-8')).decode('utf-8')
          
          payload = {
              'message': 'Update README with release tags [skip ci]',
              'content': encoded_content,
              'sha': current_sha,
              'branch': default_branch
          }
          
          response = requests.put(update_url, headers=headers, json=payload)
          
          if response.status_code in [200, 201]:
              print("✅ Successfully updated README.md via API")
          else:
              print(f"❌ Failed to update README: {response.status_code}")
              print(response.text)
              exit(1)
          
          PYTHON_SCRIPT
