name: Update README with Release Tags

on:
  workflow_dispatch:
  release:
    types: [created, published, edited, released, prereleased, unpublished]

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Update README with tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PYTHON_SCRIPT'
          import subprocess
          import json
          import re
          import base64
          import requests
          
          # Get all release tags
          result = subprocess.run(['gh', 'release', 'list', '--json', 'tagName'], 
                                capture_output=True, text=True)
          releases = json.loads(result.stdout)
          tags = [r['tagName'] for r in releases]
          
          # Read current README
          with open('README.md', 'r') as f:
            content = f.read()
          
          # Remove existing Published Versions section
          if '## Published Versions' in content:
            content = re.sub(r'\n## Published Versions\n(?:- .*?\n)*', '\n', content)
          
          # Build new section
          if tags:
            new_section = '\n## Published Versions\n'
            for tag in tags:
              new_section += f'- {tag}\n'
          else:
            new_section = ''
          
          # Clean up any double newlines
          content = re.sub(r'\n{3,}', '\n\n', content)
          
          # Write updated content to file
          with open('README.md', 'w') as f:
            f.write(content + new_section)
          
          print(f"Updated with {len(tags)} tags")
          PYTHON_SCRIPT

      - name: Commit and push via API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get the current commit SHA of the default branch
          DEFAULT_BRANCH=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}" | \
            jq -r '.default_branch')
          
          echo "Default branch: $DEFAULT_BRANCH"
          
          # Get the current commit SHA
          COMMIT_SHA=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/branches/${DEFAULT_BRANCH}" | \
            jq -r '.commit.sha')
          
          echo "Current commit SHA: $COMMIT_SHA"
          
          # Encode the updated README file
          CONTENT=$(base64 -w 0 README.md)
          
          # Create a new commit via API
          curl -X PUT \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/README.md" \
            -d "{
              \"message\": \"Update README with release tags [skip ci]\",
              \"content\": \"${CONTENT}\",
              \"sha\": \"$(curl -s -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/README.md" | jq -r '.sha')\",
              \"branch\": \"${DEFAULT_BRANCH}\"
            }"
